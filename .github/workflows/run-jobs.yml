name: Generate Resources

on:
  # 手动触发
  workflow_dispatch:
    inputs:
      force_update:
        description: "强制更新配置"
        required: false
        default: false
        type: boolean

  # main分支提交触发
  push:
    branches:
      - main
    paths:
      - "**/*.png"
      - "**/*.jpg"
      - "**/*.jpeg"

# 设置权限
permissions:
  contents: read
  pages: write
  id-token: write

# 确保只有一个部署任务同时运行
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  generate-resources:
    runs-on: ubuntu-latest
    environment: github-pages

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🗃️ Create output directory and copy something
        run: |
          mkdir -p docs
          cp -r resources/* docs/resources
      
      - name: 🧠 Run grouping script in resources/
        env:
          OUTPUT_DIR: docs
        run: python scriptsForPython/generate_images_json.py

      - name: 🧱 Generate "index.html" from template
        env:
          OUTPUT_DIR: docs
        run: |
          # 确保输出目录存在
          mkdir -p docs
          # 读取模板，替换变量，输出到最终位置
          # 注意：使用 envsubst 时，可以指定只替换特定的变量，防止干扰 HTML 里的其他 $ 符号
          envsubst '$OUTPUT_DIR' < templates/index.html > docs/index.html

      - name: 📤 Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: generate-resources

    steps:
      - name: ⬆️ Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
